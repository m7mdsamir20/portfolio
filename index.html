      // Arabic is the default; switch to English before React renders if the visitor chose it,
      // so there is never a flash of the wrong direction
      try {
        if (localStorage.getItem('portfolio-lang') === 'en') {
          document.documentElement.lang = 'en';
          document.documentElement.dir = 'ltr';
        }
